<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Shivam Kumar profile card shown in light and dark themes, split down the middle">
  <title>Shivam Kumar — Light / Dark</title>
  <defs>
    <clipPath id="ld-light"><polygon points="0,0 700,0 500,480 0,480" /></clipPath>
    <clipPath id="ld-dark"><polygon points="700,0 1200,0 1200,480 500,480" /></clipPath>
    <linearGradient id="ld-seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <g clip-path="url(#ld-light)">
    <rect width="1200" height="480" fill="#ffffff" />
    <text x="64" y="70" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8c959f" letter-spacing="3.5">PREFERS-COLOR-SCHEME: LIGHT</text>

    <circle cx="560" cy="66" r="12" fill="#f59e0b" />
    <g stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round">
      <line x1="560" y1="42" x2="560" y2="49" />
      <line x1="560" y1="83" x2="560" y2="90" />
      <line x1="536" y1="66" x2="543" y2="66" />
      <line x1="577" y1="66" x2="584" y2="66" />
      <line x1="543" y1="49" x2="548" y2="54" />
      <line x1="572" y1="78" x2="577" y2="83" />
      <line x1="577" y1="49" x2="572" y2="54" />
      <line x1="548" y1="78" x2="543" y2="83" />
    </g>

    <rect x="110" y="120" width="980" height="280" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" />
    <circle cx="190" cy="210" r="40" fill="#dbeafe" />
    <text x="190" y="220" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#1d4ed8">SK</text>
    <text x="250" y="202" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#1f2328">Shivam Kumar</text>
    <text x="250" y="230" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#656d76">@shivamkumar0097 · frontend</text>
    <text x="160" y="292" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#1f2328">Building fast, private web apps.</text>
    <text x="160" y="317" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#1f2328">Small details. Clean motion.</text>

    <rect x="160" y="342" width="130" height="30" rx="15" fill="#f6f8fa" stroke="#d0d7de" />
    <text x="225" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2328">5 PROJECTS</text>
    <rect x="300" y="342" width="132" height="30" rx="15" fill="#f6f8fa" stroke="#d0d7de" />
    <text x="366" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1f2328">REACT + GSAP</text>
  </g>

  <g clip-path="url(#ld-dark)">
    <rect width="1200" height="480" fill="#0d1117" />
    <text x="1136" y="70" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6e7681" letter-spacing="3.5">PREFERS-COLOR-SCHEME: DARK</text>

    <path d="M760 50 A16 16 0 1 0 760 82 A13 13 0 1 1 760 50 Z" fill="#a78bfa" />
    <circle cx="812" cy="48" r="1.8" fill="#a78bfa" />
    <circle cx="798" cy="74" r="1.4" fill="#a78bfa" />
    <circle cx="840" cy="86" r="1.6" fill="#a78bfa" />

    <rect x="110" y="120" width="980" height="280" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="1010" cy="210" r="40" fill="#1e3a5f" />
    <text x="1010" y="220" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#79c0ff">SK</text>
    <text x="950" y="202" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#e6edf3">Shivam Kumar</text>
    <text x="950" y="230" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#8b949e">@shivamkumar0097 · frontend</text>
    <text x="1040" y="292" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#e6edf3">Building fast, private web apps.</text>
    <text x="1040" y="317" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#e6edf3">Small details. Clean motion.</text>

    <rect x="760" y="342" width="132" height="30" rx="15" fill="#21262d" stroke="#30363d" />
    <text x="826" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#e6edf3">REACT + GSAP</text>
    <rect x="902" y="342" width="150" height="30" rx="15" fill="#0f2f1a" stroke="#1c5c33" />
    <text x="977" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#3fb950">OPEN TO WORK</text>
  </g>

  <line x1="700" y1="0" x2="500" y2="480" stroke="url(#ld-seam)" stroke-width="2" />

  <g>
    <rect x="460" y="416" width="280" height="36" rx="18" fill="#161b22" stroke="#f59e0b" stroke-width="1.2" />
    <text x="600" y="439" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f0b429">LIGHT · DARK · ONE CARD</text>
  </g>

  <text x="64" y="462" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8c959f" letter-spacing="3">LIGHT</text>
  <text x="1136" y="462" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6e7681" letter-spacing="3">DARK</text>
</svg>
